<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>
        <p class="subtitle">Track your income, expenses and savings</p>

        <!-- Income Section -->
        <div class="card">
            <h2>Income</h2>

            <label for="income">Monthly Income</label>
            <input type="number" id="income" placeholder="Enter your income">

        </div>

        <!-- Expense Section -->
        <div class="card">
            <h2>Add Expense</h2>

            <label for="expenseName">Expense Name</label>
            <input type="text" id="expenseName" placeholder="Example: Food">

            <label for="expenseAmount">Amount</label>
            <input type="number" id="expenseAmount" placeholder="Enter amount">

            <label for="category">Category</label>
            <select id="category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Education">Education</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>
        </div>

        <!-- Expense List -->
        <div class="card">
            <h2>Expense List</h2>

            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody id="expenseList">
                </tbody>
            </table>
        </div>

        <!-- Summary -->
        <div class="summary">

            <div class="summary-box">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0</p>
            </div>

            <div class="summary-box">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-box">
                <h3>Savings</h3>
                <p id="savings">₹0</p>
            </div>

        </div>

        <!-- Category Summary -->
        <div class="card">
            <h2>Expense Categories</h2>

            <ul id="categorySummary"></ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
